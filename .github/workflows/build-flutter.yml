name: Build Flutter app (v2)

# v2.*.* etiketinde Windows+macOS Flutter derlemelerini paketler ve
# GitHub Release'e ekler. flutter_app/ altindaki native rewrite icin
# ayri is akisi - eski (HTML/pywebview) build-installers.yml'a dokunmaz.
on:
  push:
    tags:
      - "v2.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build agent exe (Python backend, unchanged from the HTML app)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray pillow
          pyinstaller NetworkConsole-Agent.spec

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter Windows release
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Stage agent next to the Flutter exe
        shell: bash
        run: cp dist/NetworkConsole-Agent.exe flutter_app/build/windows/x64/runner/Release/

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:VERSION" `
            flutter_app\windows\installer.iss

      - name: Zip portable build (no-installer alternative)
        shell: bash
        run: |
          OUT="Network_Console_${VERSION}_windows_portable"
          mkdir -p "dist2/$OUT"
          cp -r flutter_app/build/windows/x64/runner/Release/* "dist2/$OUT/"
          cd dist2 && 7z a "${OUT}.zip" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-flutter
          path: |
            dist2/*.zip
            dist2/*Setup.exe
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build agent binary (Python backend, unchanged from the HTML app)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller NetworkConsole-Agent.spec
          chmod +x dist/NetworkConsole-Agent

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter macOS release
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Stage agent inside the .app bundle
        shell: bash
        run: |
          APP="flutter_app/build/macos/Build/Products/Release/network_console_app.app"
          cp dist/NetworkConsole-Agent "$APP/Contents/MacOS/NetworkConsole-Agent"
          chmod +x "$APP/Contents/MacOS/NetworkConsole-Agent"

      - name: Re-sign the bundle (agent lands after Flutter already signed it)
        shell: bash
        run: |
          APP="flutter_app/build/macos/Build/Products/Release/network_console_app.app"
          # Flutter imzaladiktan SONRA Contents/MacOS'a dosya kopyalamak
          # _CodeSignature/CodeResources muhrunu kirar. Muhru kirik bir
          # ad-hoc imza Apple Silicon'da calistirilamaz; macOS bunu
          # "is damaged and can't be opened" diye reddeder. Icten disa
          # dogru yeniden imzalayarak muhru tutarli hale getiriyoruz.
          codesign --force --sign - "$APP/Contents/MacOS/NetworkConsole-Agent"
          codesign --force --deep --sign - "$APP"

      - name: Verify the seal (fail the build instead of shipping a broken app)
        shell: bash
        run: |
          APP="flutter_app/build/macos/Build/Products/Release/network_console_app.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Agent'in muhre gerçekten girdigini dogrula - v2.7.7'de girmemisti.
          grep -q "NetworkConsole-Agent" "$APP/Contents/_CodeSignature/CodeResources"

      - name: Zip the .app (ditto keeps the bundle structure intact)
        shell: bash
        run: |
          mkdir -p dist2
          APP="flutter_app/build/macos/Build/Products/Release/network_console_app.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist2/Network_Console_${VERSION}_macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-flutter
          path: dist2/*.zip
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ls -la artifacts/*/

          # onceki v2.*.* etiketine gore degisiklik listesi (yoksa ilk surum notu)
          PREV_TAG=$(git tag --list 'v2.*.*' --sort=-v:refname | grep -v "^${TAG}\$" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}" -- . ':(exclude)flutter_app/pubspec.yaml' ':(exclude)flutter_app/lib/core/constants.dart' ':(exclude)flutter_app/windows/installer.iss' | grep -v '^- Merge ' || true)
            [ -z "$CHANGELOG" ] && CHANGELOG="- (see commit history)"
            CHANGELOG_HEADER="## What's changed since ${PREV_TAG}"
          else
            CHANGELOG="- Initial Flutter rewrite release"
            CHANGELOG_HEADER="## What's changed"
          fi

          NOTES=$(cat <<EOF
          Network Console ${VERSION} (native Flutter rewrite)

          Same measurement backend (the Python agent is unchanged), native UI
          written in Flutter - no more HTML/WebView2.

          ${CHANGELOG_HEADER}
          ${CHANGELOG}

          ## Windows
          - \`..._Setup.exe\` - regular installer (no admin rights needed, Start
            Menu + Desktop shortcuts, proper uninstall). Recommended.
          - \`..._portable.zip\` - unzip and run network_console_app.exe
            directly, no install.

          ## macOS

          No Terminal needed - just three clicks the first time:

          1. Unzip \`Network_Console_${VERSION}_macOS.zip\` and drag
             \`network_console_app.app\` into your **Applications** folder.
          2. Double-click it. macOS says it "cannot be opened because Apple
             cannot check it for malicious software" - expected: the app is
             signed, but notarizing it needs a paid Apple Developer account.
          3. Open **System Settings > Privacy & Security**, scroll down to
             the Security section, and click **Open Anyway** next to
             network_console_app. Confirm with Touch ID or your password.

          That is a one-time step. Every launch after that is a normal
          double-click.

          > Upgrading from 2.7.7 or earlier? Those macOS builds showed a
          > misleading **"app is damaged and can't be opened"** error and
          > could not be opened at all - the agent binary was copied into
          > the bundle after signing, which broke the code-signature seal.
          > Delete the old copy and use this one.

          This app lives on its own line (\`flutter-v2\` branch): if you don't
          like it, 1.5.x keeps working exactly as before, unaffected, on the
          [\`master\` branch](../../tree/master).
          EOF
          )
          gh release create "$TAG" artifacts/windows-flutter/*.zip artifacts/windows-flutter/*Setup.exe artifacts/macos-flutter/*.zip \
            --title "Network Console $TAG" \
            --notes "$NOTES" \
          || {
            gh release upload "$TAG" artifacts/windows-flutter/*.zip artifacts/windows-flutter/*Setup.exe artifacts/macos-flutter/*.zip --clobber
            gh release edit "$TAG" --title "Network Console $TAG" --notes "$NOTES"
          }

      - name: Prune old releases (keep latest 2)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --json tagName,publishedAt,isDraft \
            --jq '[.[] | select(.isDraft == false) | select(.tagName | test("^v2\\."))] | sort_by(.publishedAt) | reverse | .[2:] | .[].tagName' \
          | while read -r old; do
              echo "deleting old release $old"
              gh release delete "$old" --yes || true
            done
