name: Build installers

# Her vX.Y.Z etiketinde Windows ve macOS paketlerini derler ve ikisini
# birden tek bir GitHub Release'e ekler. Elle derleme/yukleme gerekmez.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Surum uc dosyada ayri ayri yaziyor; biri unutulursa arayuz yanlis
      # surum gosterir. Derlemeden once tutarliligi dogrula.
      - name: Check version strings agree with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bash tools/check-version.sh "${GITHUB_REF#refs/tags/v}"

  # ── Windows: NetworkConsole.exe + ajan + tek dosyalik Setup.exe ────────
  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pystray pillow

      - name: Build NetworkConsole.exe (app shell)
        run: pyinstaller NetworkConsole.spec

      - name: Build NetworkConsole-Agent.exe (local agent)
        run: pyinstaller NetworkConsole-Agent.spec

      - name: Stage bundled files next to the exes
        shell: bash
        run: |
          cp dist/NetworkConsole.exe .
          cp dist/NetworkConsole-Agent.exe .

      - name: Generate Setup spec for this version
        shell: bash
        run: |
          cat > "Network_Console_${VERSION}_Setup.spec" <<EOF
          # -*- mode: python ; coding: utf-8 -*-

          a = Analysis(
              ['setup.py'],
              pathex=[],
              binaries=[],
              datas=[('NetworkConsole.exe', '.'), ('NetworkConsole-Agent.exe', '.'), ('ag-konsolu.html', '.'), ('network-console-icon.ico', '.')],
              hiddenimports=[],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              noarchive=False,
              optimize=0,
          )
          pyz = PYZ(a.pure)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.datas,
              [],
              name='Network_Console_${VERSION}_Setup',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              upx_exclude=[],
              runtime_tmpdir=None,
              console=True,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
              icon=['network-console-icon.ico'],
          )
          EOF

      - name: Build Setup.exe
        run: pyinstaller "Network_Console_${env:VERSION}_Setup.spec"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Network_Console_${{ needs.version.outputs.version }}_Setup.exe
          if-no-files-found: error

  # ── macOS: kendi kendine yeten .app + surukle-birak .dmg ──────────────
  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pyobjc

      - name: Build .app and .dmg
        run: bash macos/build-app.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/Network_Console_${{ needs.version.outputs.version }}_macOS.dmg
          if-no-files-found: error

  # ── iki paketi tek Release'e koy ──────────────────────────────────────
  release:
    needs: [version, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Bu is repoyu checkout etmiyor; GH_REPO olmadan "gh" hedef repoyu
      # git'ten okumaya calisip "not a git repository" ile basarisiz olur.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          WIN="artifacts/windows-installer/Network_Console_${VERSION}_Setup.exe"
          MAC="artifacts/macos-installer/Network_Console_${VERSION}_macOS.dmg"
          ls -la artifacts/*/

          NOTES=$(cat <<EOF
          Network Console ${VERSION}

          ## Windows

          \`Network_Console_${VERSION}_Setup.exe\` dosyasini indirip calistirin.
          Yonetici hakki gerekmez; kullanici profiline kurulur, masaustu ve
          Baslat Menusu kisayollarini olusturur.

          ## macOS

          1. \`Network_Console_${VERSION}_macOS.dmg\` dosyasini acin ve
             uygulamayi **Applications** klasorune surukleyin.
          2. Terminal'i acip su komutu bir kez calistirin:

          \`\`\`
          xattr -dr com.apple.quarantine /Applications/NetworkConsole.app
          \`\`\`

          3. Uygulamayi normal sekilde acin.

          **2. adim neden gerekli?** Paket Apple tarafindan notarize edilmemistir
          (bunun icin ucretli Apple Developer hesabi gerekir). Tarayici indirilen
          dosyaya bir "internetten geldi" damgasi (\`com.apple.quarantine\`) koyar;
          macOS bu damgayi gorunce imzasiz uygulamayi engeller ve **sadece "Move to
          Trash" / "Done"** secenegini gosterir - guncel macOS surumlerinde o
          diyalogda "Open Anyway" **yoktur**. Yukaridaki komut yalnizca bu damgayi
          siler, uygulamaya dokunmaz. Her yeni surumu indirdiginizde tekrar
          gerekir.

          Python kurmaniza gerek yoktur; Python, pywebview ve olcum ajani pakete
          gomuludur.

          ---
          Paketler bu etiketten GitHub Actions ile otomatik uretilmistir.
          EOF
          )

          gh release create "$TAG" "$WIN" "$MAC" \
            --title "Network Console ${VERSION}" \
            --notes "$NOTES" \
          || {
            gh release upload "$TAG" "$WIN" "$MAC" --clobber
            gh release edit "$TAG" --title "Network Console ${VERSION}" --notes "$NOTES"
          }
